[package]
name = "socketioxide-client"
description = "Socket IO client implementation"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
readme.workspace = true

[dependencies]
engineioxide-client = { path = "../engineioxide-client", version = "0.1.0", "features" = ["flavor-hyper", "flavor-tungstenite", "flavor-testing"] }
socketioxide-core = { path = "../socketioxide-core", version = "0.19.0" }

bytes.workspace = true
futures-core.workspace = true
futures-util.workspace = true
tokio = { workspace = true, features = ["rt", "time", "macros"] }
serde.workspace = true
tower-service.workspace = true
http.workspace = true
http-body.workspace = true
thiserror.workspace = true
pin-project-lite.workspace = true

# Parsers
socketioxide-parser-common = { path = "../parser-common", version = "0.17.2" }
socketioxide-parser-msgpack = { path = "../parser-msgpack", version = "0.17.3", optional = true }

# Tracing
tracing = { workspace = true, optional = true }

# State
state = { version = "0.6.0", optional = true }

[features]
parser-msgpack = ["dep:socketioxide-parser-msgpack"]

# flavor-hyper = ["engineioxide-client/flavor-hyper"]
# flavor-tungstenite = ["engineioxide-client/flavor-tungstenite"]
# flavor-testing = ["engineioxide-client/flavor-testing"]
# default = ["flavor-tungstenite", "flavor-testing"]

[dev-dependencies]
socketioxide = { path = "../socketioxide", features = ["tracing"] }
tokio-tungstenite.workspace = true
axum.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = [
    "macros",
    "parking_lot",
    "rt-multi-thread",
] }
tracing-subscriber.workspace = true
criterion.workspace = true
http-body-util.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
rand = { version = "0.10", default-features = false }

# docs.rs-specific configuration
[package.metadata.docs.rs]
features = ["v4", "extensions", "tracing", "state", "msgpack"]
# Special configuration for docs.rs build
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
